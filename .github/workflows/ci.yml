name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.85"
          - stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --workspace --exclude aws-dax-fuzz
      - run: cargo check -p aws-dax-fuzz --all-targets
      - run: cargo clippy --workspace --exclude aws-dax-fuzz --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --exclude aws-dax-fuzz --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package -p aws-dax --allow-dirty --list

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ffi-bindings:
    name: Deterministic FFI bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.85"
      - run: scripts/check_ffi_bindings.sh

  ffi-native:
    name: FFI native (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            native: target/x86_64-unknown-linux-gnu/release/libaws_dax_ffi.so
            go_native: target/x86_64-unknown-linux-gnu/release/libaws_dax_ffi.so
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            native: target/aarch64-unknown-linux-gnu/release/libaws_dax_ffi.so
            go_native: target/aarch64-unknown-linux-gnu/release/libaws_dax_ffi.so
          - platform: osx-x86_64
            runner: macos-13
            target: x86_64-apple-darwin
            native: target/x86_64-apple-darwin/release/libaws_dax_ffi.dylib
            go_native: target/x86_64-apple-darwin/release/libaws_dax_ffi.a
          - platform: osx-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            native: target/aarch64-apple-darwin/release/libaws_dax_ffi.dylib
            go_native: target/aarch64-apple-darwin/release/libaws_dax_ffi.a
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-gnu
            native: target/x86_64-pc-windows-gnu/release/aws_dax_ffi.dll
            go_native: target/x86_64-pc-windows-gnu/release/libaws_dax_ffi.dll.a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}
      - run: cargo build -p aws-dax-ffi --release --target ${{ matrix.target }}
      - run: python scripts/tests/test_ffi_package_platforms.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffi-native-${{ matrix.platform }}
          path: |
            ${{ matrix.native }}
            ${{ matrix.go_native }}
          if-no-files-found: error

  ffi-package-matrix:
    name: FFI package (${{ matrix.platform }})
    needs: ffi-native
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            native: libaws_dax_ffi.so
            go_native: libaws_dax_ffi.so
          - platform: linux-aarch64
            native: libaws_dax_ffi.so
            go_native: libaws_dax_ffi.so
          - platform: osx-x86_64
            native: libaws_dax_ffi.dylib
            go_native: libaws_dax_ffi.a
          - platform: osx-arm64
            native: libaws_dax_ffi.dylib
            go_native: libaws_dax_ffi.a
          - platform: windows-x86_64
            native: aws_dax_ffi.dll
            go_native: libaws_dax_ffi.dll.a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ffi-native-${{ matrix.platform }}
          path: target/ffi-native/${{ matrix.platform }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.85"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/aws-dax-ffi/packaging/javascript-tools/package-lock.json
      - run: npm ci --ignore-scripts --prefix src/aws-dax-ffi/packaging/javascript-tools
      - run: scripts/generate_ffi_bindings.sh
      - name: Assemble target packages reproducibly
        run: |
          scripts/assemble_ffi_packages.py \
            --platform "${{ matrix.platform }}" \
            --native-library "target/ffi-native/${{ matrix.platform }}/${{ matrix.native }}" \
            --go-native-library "target/ffi-native/${{ matrix.platform }}/${{ matrix.go_native }}" \
            --skip-generate \
            --output target/ffi-packages-first
          scripts/assemble_ffi_packages.py \
            --platform "${{ matrix.platform }}" \
            --native-library "target/ffi-native/${{ matrix.platform }}/${{ matrix.native }}" \
            --go-native-library "target/ffi-native/${{ matrix.platform }}/${{ matrix.go_native }}" \
            --skip-generate \
            --output target/ffi-packages-second
          diff -ru \
            "target/ffi-packages-first/${{ matrix.platform }}" \
            "target/ffi-packages-second/${{ matrix.platform }}"
          mkdir -p target/ffi-packages
          mv \
            "target/ffi-packages-first/${{ matrix.platform }}" \
            "target/ffi-packages/${{ matrix.platform }}"
      - name: Validate target package layout
        run: |
          python3 scripts/tests/test_assemble_ffi_packages.py \
            "target/ffi-packages/${{ matrix.platform }}" \
            "target/ffi-native/${{ matrix.platform }}/${{ matrix.native }}" \
            --go-native "target/ffi-native/${{ matrix.platform }}/${{ matrix.go_native }}" \
            --platform "${{ matrix.platform }}"
      - name: Write package checksums
        run: |
          find "target/ffi-packages/${{ matrix.platform }}" -type f -print0 |
            LC_ALL=C sort -z |
            xargs -0 sha256sum > "target/ffi-packages/${{ matrix.platform }}/SHA256SUMS"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: target/ffi-packages/${{ matrix.platform }}
          format: cyclonedx-json
          output-file: target/ffi-packages/${{ matrix.platform }}/aws-dax-ffi-packages.cdx.json
      - name: Add SBOM checksum
        run: |
          sha256sum "target/ffi-packages/${{ matrix.platform }}/aws-dax-ffi-packages.cdx.json" \
            >> "target/ffi-packages/${{ matrix.platform }}/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffi-packages-${{ matrix.platform }}
          path: target/ffi-packages/${{ matrix.platform }}
          if-no-files-found: error
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: target/ffi-packages/${{ matrix.platform }}/**

  ffi-packages:
    name: FFI packages and clean consumers
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.85"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.x"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/aws-dax-ffi/packaging/javascript-tools/package-lock.json
      - run: npm ci --ignore-scripts --prefix src/aws-dax-ffi/packaging/javascript-tools
      - run: scripts/validate_ffi_packages.sh
      - name: Write package checksums
        run: |
          find target/ffi-packages -type f -print0 |
            LC_ALL=C sort -z |
            xargs -0 sha256sum > target/ffi-packages/SHA256SUMS
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: target/ffi-packages
          format: cyclonedx-json
          output-file: target/ffi-packages/aws-dax-ffi-packages.cdx.json
      - name: Add SBOM checksum
        run: |
          sha256sum target/ffi-packages/aws-dax-ffi-packages.cdx.json \
            >> target/ffi-packages/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffi-packages-linux-x86_64
          path: target/ffi-packages
          if-no-files-found: error
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: target/ffi-packages/**
