name: FFI live package parity

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: VPC-reachable dax:// or daxs:// cluster endpoint
        required: true
        type: string
      region:
        description: AWS region
        required: true
        default: eu-west-1
        type: string
      table:
        description: Existing table with string PK and SK keys
        required: true
        default: DaxParityTable
        type: string

permissions:
  contents: read

concurrency:
  group: ffi-live-package-parity
  cancel-in-progress: false

jobs:
  package-live:
    name: Six-language packaged live parity
    runs-on: [self-hosted, linux, x64, dax]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.85"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.x"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/aws-dax-ffi/packaging/javascript-tools/package-lock.json
      - run: npm ci --ignore-scripts --prefix src/aws-dax-ffi/packaging/javascript-tools
      - name: Run artifact-only live examples
        run: scripts/validate_ffi_packages.sh
        env:
          DAX_FFI_LIVE: "1"
          DAX_ENDPOINT: ${{ inputs.endpoint }}
          DAX_REGION: ${{ inputs.region }}
          DAX_TABLE_NAME: ${{ inputs.table }}
