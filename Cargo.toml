[package]
name = "aws-dax"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "AWS DAX client for Rust"
documentation = "https://docs.rs/aws-dax"
repository = "https://github.com/raduendv/aws-dax-rs"
readme = "README.md"
license = "Apache-2.0"
categories = ["api-bindings", "database"]
keywords = ["aws", "dax", "dynamodb"]
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/Cargo.toml",
    "/deny.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/MIGRATION.md",
    "/PORTING_PLAN.md",
    "/RELEASE_CHECKLIST.md",
]

[dependencies]
aws-config = "=1.8.0"
aws-credential-types = "1.3.0"
aws-sdk-dynamodb = "1.69.0"
hmac = "0.12.1"
num-bigint = "0.4.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
time = { version = "0.3.44", features = ["formatting", "macros"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.4"
rustls-native-certs = "0.8.2"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["test-util"] }
